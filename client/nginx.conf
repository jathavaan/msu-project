server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Liveness target: answers as long as nginx itself is serving, without touching the filesystem.
    # Readiness deliberately probes "/" instead, because that goes through try_files and so fails if
    # the built SPA is missing from the image — a container that is up but has nothing to serve.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
