name: financeone

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: financeone-db
      MYSQL_USER: financeone
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./server/FinanceOne
      dockerfile: FinanceOne.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=db;Port=3306;Database=financeone-db;Uid=financeone;Pwd=${MYSQL_PASSWORD};SslMode=Disabled;AllowPublicKeyRetrieval=True"
    command: [ "--migrate" ]
    depends_on:
      db:
        condition: service_healthy

  # Local stand-in for financeoneappstorage (infra/modules/storage-app.bicep) — Azurite implements
  # the same Blob Storage REST API, so BlobStorageService needs no Development-only code path
  # beyond the connection string below.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: [ "azurite-blob", "--blobHost", "0.0.0.0" ]
    ports:
      - "10000:10000"

  server:
    build:
      context: ./server/FinanceOne
      dockerfile: FinanceOne.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: "Server=db;Port=3306;Database=financeone-db;Uid=financeone;Pwd=${MYSQL_PASSWORD};SslMode=Disabled;AllowPublicKeyRetrieval=True"
      # Azurite's well-known fixed development account/key (public, same for every Azurite
      # instance everywhere — not a secret).
      ConnectionStrings__BlobStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      azurite:
        condition: service_started

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mysql-data:
