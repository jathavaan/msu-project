apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeone-client-deployment
  labels: 
    app: financeone-client
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: financeone-client
  template:
    metadata:
      labels: 
        app: financeone-client
    spec:
      containers:
        - name: financeone-client
          image: financeoneacr.azurecr.io/financeone-client:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          # Readiness probes "/" rather than /healthz on purpose: "/" goes through nginx's
          # try_files, so it only succeeds when the built SPA is actually present in the image.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness uses the static /healthz from nginx.conf — it answers whether nginx is still
          # responding, which is the only thing a restart could fix.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 256Mi
