apiVersion: v1
kind: ServiceAccount
metadata:
  name: financeone-server
  labels:
    azure.workload.identity/use: "true"
  annotations:
    # financeone-uami — grants the pod access to financeone-key-vault via Workload Identity.
    # Requires: AKS Workload Identity add-on enabled, this UAMI granted "Key Vault Secrets
    # User" on the vault, and a federated credential on the UAMI trusting this cluster's OIDC
    # issuer for subject system:serviceaccount:<namespace>:financeone-server.
    azure.workload.identity/client-id: ee98f6e4-a4e5-4172-9060-0d360305c0ed
    azure.workload.identity/tenant-id: fdf88c80-36e9-45ee-a0b2-d7eb687e39eb
