apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeone-server-deployment
  labels: 
    app: financeone-server
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: financeone-server
  template:
    metadata:
      labels: 
        app: financeone-server
    spec:
      containers:
        - name: financeone-server
          image: financeoneacr.azurecr.io/financeone-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 256Mi

