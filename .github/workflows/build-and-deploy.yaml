name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and push API container image to ACR
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set git commit SHA
        run: |
          echo "GIT_COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Docker build and push to ACR
        run: |
          az acr login --name ${{ secrets.REGISTRY_LOGIN_SERVER }}
          docker build \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-api:${{ env.GIT_COMMIT_SHA }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-api:latest \
            .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-api:${{ env.GIT_COMMIT_SHA }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-api:latest

  deploy:
    runs-on: ubuntu-latest
    name: Redeploy AKS cluster
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set git commit SHA
        run: |
          echo "GIT_COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ -n ${{ secrets.AKS_NAMESPACE }}

      - name: Roll out new image
        run: |
          kubectl set image deployment/${{ secrets.AKS_DEPLOYMENT_NAME }} \
            ${{ secrets.AKS_CONTAINER_NAME }}=${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-api:${{ env.GIT_COMMIT_SHA }} \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl rollout status deployment/${{ secrets.AKS_DEPLOYMENT_NAME }} -n ${{ secrets.AKS_NAMESPACE }}
