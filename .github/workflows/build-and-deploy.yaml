name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and push ${{ matrix.image }} image to ACR
    strategy:
      matrix:
        include:
          - image: financeone-server
            context: server/FinanceOne
            dockerfile: server/FinanceOne/FinanceOne.Api/Dockerfile
          - image: financeone-client
            context: client
            dockerfile: client/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Docker build and push to ACR
        run: |
          az acr login --name ${{ secrets.REGISTRY_LOGIN_SERVER }}
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ matrix.image }}:latest \
            ${{ matrix.context }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ matrix.image }}:latest

  deploy:
    runs-on: ubuntu-latest
    name: Redeploy AKS cluster
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ -n ${{ secrets.AKS_NAMESPACE }}

      - name: Roll out server image
        run: |
          kubectl set image deployment/financeone-server-deployment \
            financeone-server=${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:${{ github.sha }} \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl rollout status deployment/financeone-server-deployment -n ${{ secrets.AKS_NAMESPACE }}

      - name: Roll out client image
        run: |
          kubectl set image deployment/financeone-client-deployment \
            financeone-client=${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:${{ github.sha }} \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl rollout status deployment/financeone-client-deployment -n ${{ secrets.AKS_NAMESPACE }}
