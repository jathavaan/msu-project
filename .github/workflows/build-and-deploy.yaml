name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changed services
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'k8s/server-*.yaml'
            client:
              - 'client/**'
              - 'k8s/client-*.yaml'
            infra:
              - 'infra/**'

  # The exact same build + parallel test fan-out the PR workflow runs, so a direct push to main or a
  # semantic merge conflict can't reach ACR untested. No path filter — every push runs the full
  # suite regardless of what changed, so even a client-only push still proves the backend is green.
  # Sequenced after `changes` (rather than run alongside it) purely so the run graph reads
  # detect-then-act; `changes`'s outputs don't gate whether `test` runs, only what runs after it.
  test:
    name: Build and test
    needs: changes
    uses: ./.github/workflows/build-and-test.yaml
    # Granted per-job rather than at the top of this file: checks:write lets the test jobs publish
    # their results as a check run, and scoping it here keeps it away from the jobs that hold the
    # Azure OIDC token.
    permissions:
      contents: read
      checks: write

  # Applies Azure infra ahead of the AKS deploy jobs below, so app code that depends on new infra
  # (e.g. a new Storage account) never goes live before that infra exists. Independent of `test` —
  # infra correctness is validated by `what-if` on the PR (see infra.yaml), not by the app test
  # suite. Still gated by the infra-production GitHub Environment, so it pauses here for the same
  # manual approval click it always has.
  infra-deploy:
    runs-on: ubuntu-latest
    name: Deploy infra
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.infra == 'true'
    environment: infra-production
    env:
      RESOURCE_GROUP: rg-financeone-msu
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infra
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json

  # Server and client are independent from here down: each builds, pushes and deploys in its own
  # chain, so a server rollout no longer waits on a client image build (or vice versa). Both chains
  # still hang off `test`, so every test — frontend and backend — has to pass before either one
  # pushes anything to ACR.

  build-and-push-server:
    runs-on: ubuntu-latest
    name: Build and push server image
    needs: [ changes, test ]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.REGISTRY_LOGIN_SERVER }}

      - name: Build and push server image
        run: |
          docker build \
            -f server/FinanceOne/FinanceOne.Api/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:latest \
            server/FinanceOne
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:latest

  build-and-push-client:
    runs-on: ubuntu-latest
    name: Build and push client image
    needs: [ changes, test ]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.REGISTRY_LOGIN_SERVER }}

      - name: Build and push client image
        run: |
          docker build \
            -f client/Dockerfile \
            --build-arg "VITE_APPLICATIONINSIGHTS_CONNECTION_STRING=${{ secrets.APPINSIGHTS_CONNECTION_STRING }}" \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:latest \
            client
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:latest

  deploy-server:
    runs-on: ubuntu-latest
    name: Deploy server to AKS
    needs: [ build-and-push-server, infra-deploy ]
    # Waits for infra-deploy only when it actually ran (infra changed); a skip counts as clear to
    # proceed so a push that doesn't touch infra/** deploys exactly as fast as it does today.
    if: |
      !cancelled() &&
      needs.build-and-push-server.result == 'success' &&
      (needs.infra-deploy.result == 'success' || needs.infra-deploy.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # Migrations belong to the server chain and must land before the new pods roll, so they stay
      # in this job rather than becoming one of their own.
      - name: Run database migrations
        run: |
          kubectl apply -f k8s/server-serviceaccount.yaml -n ${{ secrets.AKS_NAMESPACE }}

          # Job specs are immutable, so drop any previous run before creating this one.
          kubectl delete job financeone-server-migrate -n ${{ secrets.AKS_NAMESPACE }} --ignore-not-found

          sed "s|__IMAGE_TAG__|${{ github.sha }}|" k8s/server-migration-job.yaml \
            | kubectl apply -n ${{ secrets.AKS_NAMESPACE }} -f -

          kubectl wait --for=condition=complete --timeout=180s \
            job/financeone-server-migrate -n ${{ secrets.AKS_NAMESPACE }} || {
            echo "::error::Migration job did not complete successfully"
            kubectl logs job/financeone-server-migrate -n ${{ secrets.AKS_NAMESPACE }} --all-containers
            exit 1
          }

      - name: Deploy server
        run: |
          kubectl apply \
            -f k8s/server-serviceaccount.yaml \
            -f k8s/server-deployment.yaml \
            -f k8s/server-service.yaml \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl set image deployment/financeone-server-deployment \
            financeone-server=${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:${{ github.sha }} \
            -n ${{ secrets.AKS_NAMESPACE }}

          # Now that the pod has a readiness probe, this genuinely blocks until the new pod can
          # reach MySQL — so it needs a timeout, or a bad image would hang the job for hours. The
          # old ReplicaSet keeps serving throughout, so a failure here leaves the last good
          # version running.
          kubectl rollout status deployment/financeone-server-deployment \
            -n ${{ secrets.AKS_NAMESPACE }} --timeout=300s || {
            echo "::error::Server rollout did not become ready; the previous version is still serving"
            kubectl describe deployment/financeone-server-deployment -n ${{ secrets.AKS_NAMESPACE }}
            kubectl logs -l app=financeone-server -n ${{ secrets.AKS_NAMESPACE }} --tail=100 --all-containers
            exit 1
          }

  deploy-client:
    runs-on: ubuntu-latest
    name: Deploy client to AKS
    needs: [ build-and-push-client, infra-deploy ]
    if: |
      !cancelled() &&
      needs.build-and-push-client.result == 'success' &&
      (needs.infra-deploy.result == 'success' || needs.infra-deploy.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy client
        run: |
          kubectl apply \
            -f k8s/client-deployment.yaml \
            -f k8s/client-service.yaml \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl set image deployment/financeone-client-deployment \
            financeone-client=${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:${{ github.sha }} \
            -n ${{ secrets.AKS_NAMESPACE }}

          kubectl rollout status deployment/financeone-client-deployment \
            -n ${{ secrets.AKS_NAMESPACE }} --timeout=300s || {
            echo "::error::Client rollout did not become ready; the previous version is still serving"
            kubectl describe deployment/financeone-client-deployment -n ${{ secrets.AKS_NAMESPACE }}
            kubectl logs -l app=financeone-client -n ${{ secrets.AKS_NAMESPACE }} --tail=100 --all-containers
            exit 1
          }
