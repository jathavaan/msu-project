name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changed services
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'k8s/server-*.yaml'
            client:
              - 'client/**'
              - 'k8s/client-*.yaml'

  build-and-push:
    runs-on: ubuntu-latest
    name: Build and push images to ACR
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.REGISTRY_LOGIN_SERVER }}

      - name: Build and push server image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
        run: |
          docker build \
            -f server/FinanceOne/FinanceOne.Api/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:latest \
            server/FinanceOne
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:latest

      - name: Build and push client image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
        run: |
          docker build \
            -f client/Dockerfile \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:${{ github.sha }} \
            -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:latest \
            client
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:latest

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to AKS
    needs: [changes, build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy server
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
        run: |
          kubectl apply \
            -f k8s/server-serviceaccount.yaml \
            -f k8s/server-deployment.yaml \
            -f k8s/server-service.yaml \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl set image deployment/financeone-server-deployment \
            financeone-server=${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-server:${{ github.sha }} \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl rollout status deployment/financeone-server-deployment -n ${{ secrets.AKS_NAMESPACE }}

      - name: Deploy client
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
        run: |
          kubectl apply \
            -f k8s/client-deployment.yaml \
            -f k8s/client-service.yaml \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl set image deployment/financeone-client-deployment \
            financeone-client=${{ secrets.REGISTRY_LOGIN_SERVER }}/financeone-client:${{ github.sha }} \
            -n ${{ secrets.AKS_NAMESPACE }}
          kubectl rollout status deployment/financeone-client-deployment -n ${{ secrets.AKS_NAMESPACE }}
