name: Build and Test

# Reusable workflow — the single definition of "is this code good enough to merge and ship".
# Called by pull-request.yaml on every PR and by build-and-deploy.yaml before anything is pushed
# to ACR, so the checks that gate a merge and the checks that gate a deploy can never drift apart.
#
#   build-server ──┬── test-server-unit          (fast, no Docker)
#                  └── test-server-integration   (Testcontainers MySQL)
#   build-client ───── test-client               (vitest)
#
# The two build jobs run in parallel with each other, and each set of tests fans out in parallel
# once its build has proven the code compiles.
#
# run-server/run-client default to true so build-and-deploy.yaml's call (which never passes them)
# always gets the full suite before shipping — only pull-request.yaml passes false for the side
# that a PR's changed paths don't touch, for faster PR feedback.
on:
  workflow_call:
    inputs:
      run-server:
        description: Run the server build/test jobs.
        type: boolean
        default: true
      run-client:
        description: Run the client build/test jobs.
        type: boolean
        default: true

# checks:write is what lets dorny/test-reporter publish results as a check run with per-failure
# annotations. Each caller grants it on the job that calls this workflow, never workflow-wide.
permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'

jobs:
  build-server:
    name: Build server
    runs-on: ubuntu-latest
    if: inputs.run-server
    defaults:
      run:
        working-directory: server/FinanceOne
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # There are no packages.lock.json files, so setup-dotnet's built-in cache can't be used —
      # key the package cache off the project files instead.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/FinanceOne/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  test-server-unit:
    name: Test server (unit)
    runs-on: ubuntu-latest
    needs: build-server
    if: inputs.run-server
    defaults:
      run:
        working-directory: server/FinanceOne
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/FinanceOne/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Handlers and validators against substituted repositories. No database, no Docker — this job
      # is the fast signal, and should stay that way.
      - name: Run unit tests
        run: >-
          dotnet test FinanceOne.UnitTests/FinanceOne.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      # Turns the .trx into a check run: a pass/fail summary plus, for each failure, the test name
      # and stack trace annotated onto the diff. fail-on-error stays false because the step above
      # has already failed the job — otherwise one broken test reports as two failed checks.
      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Server unit tests
          path: server/FinanceOne/TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-unit-test-results
          path: server/FinanceOne/TestResults/
          if-no-files-found: ignore

  test-server-integration:
    name: Test server (integration)
    runs-on: ubuntu-latest
    needs: build-server
    if: inputs.run-server
    defaults:
      run:
        working-directory: server/FinanceOne
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/FinanceOne/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Testcontainers starts a real MySQL 8.0 container and migrates it with the production
      # migrations. GitHub's ubuntu-latest runners ship a working Docker daemon, so no extra
      # service or setup step is needed.
      - name: Run integration tests
        run: >-
          dotnet test FinanceOne.IntegrationTests/FinanceOne.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Server integration tests
          path: server/FinanceOne/TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-integration-test-results
          path: server/FinanceOne/TestResults/
          if-no-files-found: ignore

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    if: inputs.run-client
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b && vite build` — this is where a type error in src/ or in a test file surfaces,
      # since tests live under src/ and are part of the same TypeScript project.
      - name: Build
        run: npm run build

  test-client:
    name: Test client
    runs-on: ubuntu-latest
    needs: build-client
    if: inputs.run-client
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # vite.config.ts adds the junit reporter when CI is set, so the XML exists by this point.
      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Client tests
          path: client/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-results
          path: client/test-results/
          if-no-files-found: ignore
