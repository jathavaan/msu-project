name: Pull Request

# Only on the PR itself. Triggering on branch pushes as well would run the whole suite twice for
# every push to a branch with an open PR. Use workflow_dispatch to check a branch before opening one.
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Pushing again to a branch makes the in-flight run obsolete, so cancel it rather than paying for
# both. Keyed per ref, so runs on different branches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `other` catches everything outside server/** and client/** (root files, .github/**, k8s/**,
  # infra/**, docs, ...) so an ambiguous change still runs both suites below rather than silently
  # skipping everything. `infra` is only consumed by infra-what-if below.
  changes:
    runs-on: ubuntu-latest
    name: Detect changed paths
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
      other: ${{ steps.filter.outputs.other }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            client:
              - 'client/**'
            other:
              - '**'
              - '!server/**'
              - '!client/**'
            infra:
              - 'infra/**'

  build-and-test:
    name: Build and test
    needs: changes
    uses: ./.github/workflows/build-and-test.yaml
    # checks:write lets the test jobs publish their results as a check run with per-failure
    # annotations on the diff. A called workflow can never hold more than its caller grants here.
    permissions:
      contents: read
      checks: write
    # Skip a side's build+test jobs only when this PR's changes are confined to the other side —
    # any change outside both server/** and client/** (`other`) forces both, same as
    # workflow_dispatch, since it has no diff to filter on. build-and-deploy.yaml's call passes
    # neither input, so its full suite is unaffected by any of this.
    with:
      run-server: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true' || needs.changes.outputs.other == 'true' }}
      run-client: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true' || needs.changes.outputs.other == 'true' }}

  # Converted from infra.yaml's own pull_request trigger so it shares this workflow's
  # cancel-in-progress concurrency group instead of piling up stale runs on repeated pushes.
  # workflow_dispatch has no diff to filter on, so it forces the call the same way
  # build-and-deploy.yaml's changes-gated jobs force a run on manual dispatch.
  infra-what-if:
    name: Infra what-if
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra.yaml
    # id-token:write is what azure/login needs to fetch the OIDC token; pull-requests:write is what
    # posts the what-if result as a PR comment. Both capped here, same as checks:write above.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # The what-if job needs the AZURE_* secrets, and a reusable workflow in another file gets none
    # of the caller's secrets unless explicitly passed.
    secrets: inherit
