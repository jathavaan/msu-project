name: Bug report
description: Something isn't working as expected
labels: [bug]
projects: ["jathavaan/7"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Client (React app)
        - Server (API)
        - CI/CD
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs (optional)
    validations:
      required: false
